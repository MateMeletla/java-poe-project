# Builds the JavaApplication NetBeans/Ant project and runs the JUnit tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

name: TestJava

# Runs the JUnit tests every time code is pushed or a pull request is opened
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Every "run" step executes inside the NetBeans project folder
    # (the folder that contains build.xml, nbproject/, src/, test/ and lib/)
    defaults:
      run:
        working-directory: JavaApplication

    steps:
      # 1. Download the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install JDK 26 (must match javac.source / javac.target in nbproject/project.properties)
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      # 3. Install a recent Ant directly from Apache.
      #    The binary distribution already includes the <junit> task.
      - name: Install Ant
        run: |
          curl -sSL -o "$RUNNER_TEMP/ant.tar.gz" https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.15-bin.tar.gz
          tar -xzf "$RUNNER_TEMP/ant.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-ant-1.10.15/bin" >> "$GITHUB_PATH"

      # 4. Print versions so problems are easy to spot in the log
      - name: Check Java and Ant versions
        run: |
          java -version
          ant -version

      # 5. Download the libraries the runner doesn't have:
      #    JUnit 4 and Hamcrest (NetBeans keeps these inside the IDE)
      #    json-simple (the project's jar reference points to a path on your PC)
      - name: Download libraries
        run: |
          mkdir -p ci-libs
          curl -sSL -o ci-libs/junit-4.13.2.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSL -o ci-libs/hamcrest-core-1.3.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          curl -sSL -o ci-libs/json-simple-1.1.1.jar https://repo1.maven.org/maven2/com/googlecode/json-simple/json-simple/1.1.1/json-simple-1.1.1.jar
          ls -l ci-libs

      # 6. Compile and run all tests.
      #
